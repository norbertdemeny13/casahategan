<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cont – Casa Hațegan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="images/logo.svg">
</head>
<body>
  <div id="chrome-top"></div>
  <main class="page">
    <div class="wrap prose">
      <h1>Contul meu</h1>
      <p>Intră în cont ca să vezi comenzile, sau comandă direct din magazin și te contactăm noi pentru confirmare.</p>
      <form class="form" data-local-form>
        <label class="field"><span>Email</span><input type="email" name="email" required></label>
        <label class="field"><span>Parolă</span><input type="password" name="parola" required autocomplete="current-password"></label>
        <button class="btn btn-gold" type="submit">Autentificare</button>
        <p class="notice" data-form-note hidden>Conturile online nu sunt conectate în această copie statică. Pentru comenzi și cont, sună la <a href="tel:+40752084770">0752 084 770</a> sau scrie la <a href="mailto:office.casahategan@gmail.com">office.casahategan@gmail.com</a>.</p>
      </form>
    </div>
  </main>
  <div id="chrome-bottom"></div>
  <script src="js/catalog.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
